[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "estante-worker"
version = "0.1.0"
description = "Fills in book details for the Estante Google Sheet, and later prices, descriptions and publishing."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "isbnlib>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["estante_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
