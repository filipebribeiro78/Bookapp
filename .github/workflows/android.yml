name: Build app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the APK
        run: |
          set -o pipefail
          { ./gradlew -p core test && ./gradlew :app:assembleDebug; } 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk "estante-${{ github.run_number }}.apk"

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "estante-${{ github.run_number }}.apk" \
            --title "Estante build ${{ github.run_number }}" \
            --notes "Open this page on the phone and tap the .apk file to install it." \
            --latest

      # Claude's cloud session can read this repository through git but not GitHub's API, so the build
      # result (APK or log) is also pushed to the ci-result branch for it to fetch.
      - name: Share the result on the ci-result branch
        if: always()
        run: |
          mkdir -p /tmp/ci-result
          cp build.log /tmp/ci-result/ 2>/dev/null || echo "No build log was written." > /tmp/ci-result/build.log
          cp estante-*.apk /tmp/ci-result/ 2>/dev/null || true
          echo "${{ job.status }} build ${{ github.run_number }} of ${{ github.sha }}" > /tmp/ci-result/STATUS
          cd /tmp/ci-result
          git init -q -b ci-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${{ github.run_number }}: ${{ job.status }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-result
