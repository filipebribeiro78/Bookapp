name: Build app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test shared logic
        run: ./gradlew -p core test

      - name: Build the APK
        run: ./gradlew :app:assembleDebug

      - name: Name the APK after the build number
        run: cp app/build/outputs/apk/debug/app-debug.apk "estante-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: estante-${{ github.run_number }}
          path: estante-${{ github.run_number }}.apk
